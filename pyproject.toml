[project]
name = "fii-data-ai-platform"
version = "0.1.0"
description = "Modern Data & AI platform for Brazilian Real Estate Investment Funds (FIIs)."
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "botocore[crt]",
    "requests",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]